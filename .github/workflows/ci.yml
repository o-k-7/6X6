name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check sample Signal
        run: python tools/check_6x6.py examples/sample-signal.txt

      - name: Run offline evaluation
        run: python tools/evaluate.py --cases evals/cases.json --outputs evals/sample_outputs.json

      - name: Run security gate
        run: python tools/security_check.py

      - name: Run release gate
        run: python tools/release_check.py
