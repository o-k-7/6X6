name: Publish v1.0.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.2.yml
      - .release/v1.0.2.md

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'o-k-7/6X6'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate release candidate
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python tools/check_6x6.py examples/sample-signal.txt
          python tools/evaluate.py --cases evals/cases.json --outputs evals/sample_outputs.json
          python tools/security_check.py
          python tools/release_check.py
          python - <<'PY'
          from pathlib import Path
          import re
          skill = Path('skills/6x6/SKILL.md').read_text(encoding='utf-8')
          assert re.search(r'^  version: "1\.0\.2"$', skill, re.M)
          assert 'v1.0.2 stable release' in Path('README.md').read_text(encoding='utf-8')
          assert '## [1.0.2]' in Path('CHANGELOG.md').read_text(encoding='utf-8')
          assert 'no universal model-compliance claim is made' in Path('CHANGELOG.md').read_text(encoding='utf-8')
          PY

      - name: Prepare immutable release snapshot
        run: |
          set -euo pipefail
          cp .release/v1.0.2.md /tmp/v1.0.2.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v1.0.2.yml .release/v1.0.2.md
          python tools/release_check.py
          git commit -m 'chore: retire v1.0.2 release publisher'
          git push origin HEAD:main

      - name: Publish release and remove merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          if gh release view v1.0.2 >/dev/null 2>&1; then
            echo 'v1.0.2 already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create v1.0.2 \
            --target "$release_sha" \
            --title '6X6 v1.0.2' \
            --notes-file /tmp/v1.0.2.md \
            --latest
          for branch in \
            fix/v1-acceptance-hardening \
            release/v1.0.2 \
            ops/publish-v1.0.2; do
            git push origin --delete "$branch" || true
          done
