name: Publish v1.0.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.1.yml
      - .release/v1.0.1.md

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'o-k-7/6X6'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate release candidate
        run: |
          python -m unittest discover -s tests -v
          python tools/check_6x6.py examples/sample-signal.txt
          python tools/evaluate.py --cases evals/cases.json --outputs evals/sample_outputs.json
          python tools/security_check.py
          python tools/release_check.py
          python - <<'PY'
          from pathlib import Path
          import re
          skill = Path('skills/6x6/SKILL.md').read_text(encoding='utf-8')
          assert re.search(r'^  version: "1\.0\.1"$', skill, re.M)
          assert 'v1.0.1 stable release' in Path('README.md').read_text(encoding='utf-8')
          assert '## [1.0.1]' in Path('CHANGELOG.md').read_text(encoding='utf-8')
          PY

      - name: Prepare immutable release snapshot
        run: |
          cp .release/v1.0.1.md /tmp/v1.0.1.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v1.0.1.yml .release/v1.0.1.md
          python tools/release_check.py
          git commit -m 'chore: retire v1.0.1 release publisher'
          git push origin HEAD:main

      - name: Publish release and remove merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha=$(git rev-parse HEAD)
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo 'v1.0.1 already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create v1.0.1 \
            --target "$release_sha" \
            --title '6X6 v1.0.1' \
            --notes-file /tmp/v1.0.1.md \
            --latest
          git push origin --delete release/v1.0.1-public-polish || true
          git push origin --delete release/v1.0.1 || true
