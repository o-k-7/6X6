name: Publish v1.0.0

on:
  push:
    branches: [main]
    paths:
      - ".release/v1.0.0.md"
      - ".github/workflows/release-v1.0.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
          else
            gh release create v1.0.0 \
              --target "$GITHUB_SHA" \
              --title "6X6 v1.0.0" \
              --notes-file .release/v1.0.0.md
          fi

      - name: Remove superseded v0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release delete v0.5.0 --cleanup-tag --yes
            echo "Removed v0.5.0 release and tag"
          else
            echo "v0.5.0 release already absent"
          fi
